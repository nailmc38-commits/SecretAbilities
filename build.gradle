plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    def sherpaJvm = implementation('com.github.k2-fsa.sherpa-onnx:sherpa-onnx-jvm:v1.13.8')
    def sherpaWin = implementation('com.github.k2-fsa.sherpa-onnx:sherpa-onnx-native-lib-win-x64:v1.13.8')
    include sherpaJvm
    include sherpaWin
}
sourceSets {
    main {
        java.srcDirs = ['survos/src/main/java']
        resources.srcDirs = ['survos/src/main/resources']
    }
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}