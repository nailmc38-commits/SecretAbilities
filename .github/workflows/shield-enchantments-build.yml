name: Build Shield Enchantments

on:
  push:
    branches:
      - shield-enchantments-build
    paths:
      - 'shield-enchantments-build/**'
      - '.github/workflows/shield-enchantments-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        working-directory: shield-enchantments-build
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: shield-enchantments-jar
          path: shield-enchantments-build/build/libs/shield-enchantments-0.1.0.jar
          if-no-files-found: error
