name: Build SURV OS Mega

on:
  push:
    branches: [ surv-os-mega ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Bundle SeedCrackerX
        run: |
          mkdir -p survivalutils/src/main/resources/META-INF/jars
          curl -L --fail --retry 3 \
            https://github.com/19MisterX98/SeedcrackerX/releases/download/2.15.6/seedcrackerX-2.15.6.jar \
            -o survivalutils/src/main/resources/META-INF/jars/seedcrackerX-2.15.6.jar
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SURV-OS-Mega-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
