name: Build QuickCraft Client

on:
  push:
    branches:
      - quickcraft-build
    paths:
      - 'quickcraft-client/**'
      - '.github/workflows/quickcraft-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        working-directory: quickcraft-client
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: quickcraft-client-jar
          path: quickcraft-client/build/libs/quickcraft-client-1.0.0.jar
          if-no-files-found: error
