name: Build DogBreeder

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Upload DogBreeder JAR
        uses: actions/upload-artifact@v4
        with:
          name: DogBreeder-1.21.11
          path: |
            build/libs/dogbreeder-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
