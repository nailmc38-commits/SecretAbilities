name: Build EXP Enchantment

on:
  push:
    branches:
      - exp-enchant-build
    paths:
      - 'exp-enchant/**'
      - '.github/workflows/exp-enchant-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        working-directory: exp-enchant
        run: gradle build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: exp-enchant-jar
          path: exp-enchant/build/libs/exp-enchant-1.21.11-1.0.0.jar
          if-no-files-found: error
