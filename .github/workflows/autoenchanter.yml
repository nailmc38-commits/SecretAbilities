name: Build AutoEnchanter

on:
  push:
    branches: [ "autoenchanter-1.21.11" ]
    paths:
      - "autoenchanter/**"
      - ".github/workflows/autoenchanter.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Bundle 1.21.11 enchant engine
        run: |
          mkdir -p autoenchanter/libs
          mkdir -p autoenchanter/src/main/resources/META-INF
          curl -L --fail --retry 3 \
            https://github.com/Earthcomputer/clientcommands/releases/download/v2.13.2/clientcommands-2.13.2.jar \
            -o autoenchanter/libs/clientcommands-2.13.2.jar
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Earthcomputer/clientcommands/v2.13.2/LICENSE \
            -o autoenchanter/src/main/resources/META-INF/LICENSE-clientcommands.txt

      - name: Build
        run: gradle -p autoenchanter clean build --stacktrace

      - name: Verify bundled engine
        run: |
          JAR=$(find autoenchanter/build/libs -maxdepth 1 -name 'autoenchanter-*.jar' ! -name '*-sources.jar' | head -n 1)
          echo "Checking $JAR"
          jar tf "$JAR" | grep -i "clientcommands-2.13.2.jar"
      - name: Upload AutoEnchanter JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoEnchanter-1.21.11
          path: |
            autoenchanter/build/libs/autoenchanter-*.jar
            !autoenchanter/build/libs/*-sources.jar
          if-no-files-found: error
