name: Build Fast Auto Totem

on:
  push:
    branches: [ fast-auto-totem-1.21.11 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Verify JAR
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'Fast-Auto-Totem-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -f "$JAR"
          jar tf "$JAR" | grep 'com/fastautototem/FastAutoTotemClient.class'
          jar tf "$JAR" | grep 'fabric.mod.json'
          unzip -t "$JAR"
          sha256sum "$JAR"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Auto-Totem-1.21.11
          path: |
            build/libs/Fast-Auto-Totem-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
